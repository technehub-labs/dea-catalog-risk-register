id: dea:risk-inhibit-response-function-t0835-manipulate-i-o-i-v879bh
type: Risk
name: T0835 — Manipulate I/O Image
description: Adversaries may manipulate the I/O image of PLCs through various means
  to prevent them from functioning as expected. Methods of I/O image manipulation
  may include overriding the I/O table via direct memory manipulation or using the
  override function used for testing PLC programs.
