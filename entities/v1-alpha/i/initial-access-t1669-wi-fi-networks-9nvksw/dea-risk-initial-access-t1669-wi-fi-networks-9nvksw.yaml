id: dea:risk-initial-access-t1669-wi-fi-networks-9nvksw
type: Risk
name: T1669 — Wi-Fi Networks
description: Adversaries may gain initial access to target systems by connecting to
  wireless networks. They may accomplish this by exploiting open Wi-Fi networks used
  by target devices or by accessing secured Wi-Fi networks — requiring [Valid Accounts](https://attack.mitre.org/techniques/T1078)
  — belonging to a target organization.
