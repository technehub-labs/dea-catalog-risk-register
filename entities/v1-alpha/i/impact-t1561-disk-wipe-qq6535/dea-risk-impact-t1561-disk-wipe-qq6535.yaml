id: dea:risk-impact-t1561-disk-wipe-qq6535
type: Risk
name: T1561 — Disk Wipe
description: Adversaries may wipe or corrupt raw disk data on specific systems or
  in large numbers in a network to interrupt availability to system and network resources.
  With direct write access to a disk, adversaries may attempt to overwrite portions
  of disk data.
