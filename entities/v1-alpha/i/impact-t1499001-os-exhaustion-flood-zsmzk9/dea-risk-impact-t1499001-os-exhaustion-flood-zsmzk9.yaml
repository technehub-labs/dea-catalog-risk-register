id: dea:risk-impact-t1499001-os-exhaustion-flood-zsmzk9
type: Risk
name: T1499.001 — OS Exhaustion Flood
description: Adversaries may launch a denial of service (DoS) attack targeting an
  endpoint's operating system (OS). A system's OS is responsible for managing the
  finite resources as well as preventing the entire system from being overwhelmed
  by excessive demands on its capacity.
