id: dea:risk-impact-t1662-data-destruction-zgqz3p
type: Risk
name: T1662 — Data Destruction
description: Adversaries may destroy data and files on specific devices or in large
  numbers to interrupt availability to systems, services, and network resources. Data
  destruction is likely to render stored data irrecoverable by forensic techniques
  through overwriting files or data on local and remote drives.
