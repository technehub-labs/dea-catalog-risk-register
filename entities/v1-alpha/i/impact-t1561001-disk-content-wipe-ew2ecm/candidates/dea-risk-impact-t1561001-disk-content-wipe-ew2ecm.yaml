id: dea:risk-impact-t1561001-disk-content-wipe-ew2ecm
type: Risk
name: T1561.001 — Disk Content Wipe
description: Adversaries may erase the contents of storage devices on specific systems
  or in large numbers in a network to interrupt availability to system and network
  resources. Adversaries may partially or completely overwrite the contents of a storage
  device rendering the data irrecoverable through the storage interface.
