id: dea:risk-inhibit-response-function-t0892-change-credentia-2p2uwc
type: Risk
name: T0892 — Change Credential
description: Adversaries may modify software and device credentials to prevent operator
  and responder access. Depending on the device, the modification or addition of this
  password could prevent any device configuration actions from being accomplished
  and may require a factory reset or replacement of hardware.
