id: dea:risk-impact-t1491001-internal-defacement-4pfeyd
type: Risk
name: T1491.001 — Internal Defacement
description: An adversary may deface systems internal to an organization in an attempt
  to intimidate or mislead users, thus discrediting the integrity of the systems.
  This may take the form of modifications to internal websites or server login messages,
  or directly to user systems with the replacement of the desktop wallpaper.
