id: dea:risk-inhibit-response-function-t1691001-command-messa-gpy25u
type: Risk
name: T1691.001 — Command Message
description: Adversaries may block a command message from reaching its intended target
  to prevent command execution. In OT networks, command messages are sent to provide
  instructions to control system devices. A blocked command message can inhibit response
  functions from correcting a disruption or unsafe condition.
