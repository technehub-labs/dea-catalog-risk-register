id: dea:risk-initial-access-t0817-drive-by-compromise-xdmfnm
type: Risk
name: T0817 — Drive-by Compromise
description: Adversaries may gain access to a system during a drive-by compromise,
  when a user visits a website as part of a regular browsing session. With this technique,
  the user's web browser is targeted and exploited simply by visiting the compromised
  website.
