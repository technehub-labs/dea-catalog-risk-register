type: Risk
name: T1643 — Generate Traffic from Victim
description: Adversaries may generate outbound traffic from devices. This is typically
  performed to manipulate external outcomes, such as to achieve carrier billing fraud
  or to manipulate app store rankings or ratings. Outbound traffic is typically generated
  as SMS messages or general web traffic, but may take other forms as well.
