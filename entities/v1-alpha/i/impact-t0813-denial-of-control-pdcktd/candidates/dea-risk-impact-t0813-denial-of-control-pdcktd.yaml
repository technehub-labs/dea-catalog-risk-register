id: dea:risk-impact-t0813-denial-of-control-pdcktd
type: Risk
name: T0813 — Denial of Control
description: Adversaries may cause a denial of control to temporarily prevent operators
  and engineers from interacting with process controls. An adversary may attempt to
  deny process control access to cause a temporary loss of communication with the
  control device or to prevent operator adjustment of process controls.
