id: dea:risk-initial-access-t1476-deliver-malicious-applicati-4rws3t
type: Risk
name: T1476 — Deliver Malicious Application via Other Means
description: Adversaries may direct victims to download malicious applications via
  ways that avoid an authorized application store (e.g. Google Play Store or Apple
  App Store). For example, victims may be directed to downloading a malicious APK
  directly from a domain.
