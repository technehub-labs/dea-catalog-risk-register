type: Risk
name: T1499 — Endpoint Denial of Service
description: Adversaries may perform Endpoint Denial of Service (DoS) attacks to degrade
  or block the availability of services to users. Endpoint DoS can be performed by
  exhausting the system resources those services are hosted on or exploiting the system
  to cause a persistent crash condition.
