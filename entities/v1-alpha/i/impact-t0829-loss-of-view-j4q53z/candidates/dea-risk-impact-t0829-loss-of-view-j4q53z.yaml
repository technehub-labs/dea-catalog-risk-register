id: dea:risk-impact-t0829-loss-of-view-j4q53z
type: Risk
name: T0829 — Loss of View
description: Adversaries may cause a sustained or permanent loss of view where the
  ICS equipment will require local, hands-on operator intervention; for instance,
  a restart or manual operation. By causing a sustained reporting or visibility loss,
  the adversary can effectively hide the present state of operations.
