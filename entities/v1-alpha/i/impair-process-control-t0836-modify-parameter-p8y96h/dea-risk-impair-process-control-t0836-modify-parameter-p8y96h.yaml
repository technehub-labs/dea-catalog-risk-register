id: dea:risk-impair-process-control-t0836-modify-parameter-p8y96h
type: Risk
name: T0836 — Modify Parameter
description: Adversaries may modify parameters used to instruct industrial control
  system devices. These devices operate via programs that dictate how and when to
  perform actions based on such parameters. Such parameters can determine the extent
  to which an action is performed and may specify additional options.
