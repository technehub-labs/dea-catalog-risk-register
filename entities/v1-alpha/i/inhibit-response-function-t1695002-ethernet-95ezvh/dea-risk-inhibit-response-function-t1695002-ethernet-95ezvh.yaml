id: dea:risk-inhibit-response-function-t1695002-ethernet-95ezvh
type: Risk
name: T1695.002 — Ethernet
description: Adversaries may block access to Ethernet communications to prevent instructions
  or configurations messages from reaching target systems and devices. Ethernet connections
  allow for communications between IT and OT systems and devices. Blocking Ethernet
  communications may also block command and reporting messages.
