type: Risk
name: T1565.002 — Transmitted Data Manipulation
description: Adversaries may alter data en route to storage or other systems in order
  to manipulate external outcomes or hide activity, thus threatening the integrity
  of the data. By manipulating transmitted data, adversaries may attempt to affect
  a business process, organizational understanding, and decision making.
