id: dea:risk-inhibit-response-function-t0800-activate-firmwar-chgzb8
type: Risk
name: T0800 — Activate Firmware Update Mode
description: Adversaries may activate firmware update mode on devices to prevent expected
  response functions from engaging in reaction to an emergency or process malfunction.
  For example, devices such as protection relays may have an operation mode designed
  for firmware installation.
