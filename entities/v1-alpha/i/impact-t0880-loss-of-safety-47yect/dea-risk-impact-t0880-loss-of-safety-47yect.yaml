id: dea:risk-impact-t0880-loss-of-safety-47yect
type: Risk
name: T0880 — Loss of Safety
description: Adversaries may compromise safety system functions designed to maintain
  safe operation of a process when unacceptable or dangerous conditions occur. Safety
  systems are often composed of the same elements as control systems but have the
  sole purpose of ensuring the process fails in a predetermined safe manner.
