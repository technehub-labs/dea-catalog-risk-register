id: dea:risk-inhibit-response-function-t1695001-serial-com-tnsbay
type: Risk
name: T1695.001 — Serial COM
description: Adversaries may block access to serial COM to prevent instructions or
  configurations from reaching target devices. Serial Communication ports (COM) allow
  communication with control system devices. Devices can receive command and configuration
  messages over such serial COM.
