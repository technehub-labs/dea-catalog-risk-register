id: dea:risk-initial-access-t1566001-spearphishing-attachment-2swqwz
type: Risk
name: T1566.001 — Spearphishing Attachment
description: Adversaries may send spearphishing emails with a malicious attachment
  in an attempt to gain access to victim systems. Spearphishing attachment is a specific
  variant of spearphishing. Spearphishing attachment is different from other forms
  of spearphishing in that it employs the use of malware attached to an email.
