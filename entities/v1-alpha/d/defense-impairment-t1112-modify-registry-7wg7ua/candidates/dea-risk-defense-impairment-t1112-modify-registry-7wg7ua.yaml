name: T1112 — Modify Registry
description: Adversaries may interact with the Windows Registry as part of a variety
  of other techniques to aid in defense evasion, persistence, and execution. Access
  to specific areas of the Registry depends on account permissions, with some keys
  requiring administrator-level access.
