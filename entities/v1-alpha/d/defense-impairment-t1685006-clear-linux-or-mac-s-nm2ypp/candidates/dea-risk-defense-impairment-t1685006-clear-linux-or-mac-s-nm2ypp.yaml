id: dea:risk-defense-impairment-t1685006-clear-linux-or-mac-s-nm2ypp
type: Risk
name: T1685.006 — Clear Linux or Mac System Logs
description: Adversaries may clear system logs to hide evidence of an intrusion. macOS
  and Linux both keep track of system or user-initiated actions via system logs. The
  majority of native system logging is stored under the `/var/log/` directory.
