id: dea:risk-defense-impairment-t1601-modify-system-image-4rbe79
type: Risk
name: T1601 — Modify System Image
description: Adversaries may make changes to the operating system of embedded network
  devices to weaken defenses and provide new capabilities for themselves. On such
  devices, the operating systems are typically monolithic and most of the device functionality
  and capabilities are contained within a single file.
