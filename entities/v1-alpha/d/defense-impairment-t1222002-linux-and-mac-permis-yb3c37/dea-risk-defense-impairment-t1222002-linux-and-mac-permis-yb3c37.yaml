name: T1222.002 — Linux and Mac Permissions
description: Adversaries may modify file or directory permissions/attributes to evade
  access control lists (ACLs) and access protected files. File and directory permissions
  are commonly managed by ACLs configured by the file or directory owner, or users
  with the appropriate permissions.
