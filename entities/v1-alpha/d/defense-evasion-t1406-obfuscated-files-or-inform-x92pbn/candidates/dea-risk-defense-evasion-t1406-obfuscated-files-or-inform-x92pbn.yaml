id: dea:risk-defense-evasion-t1406-obfuscated-files-or-inform-x92pbn
type: Risk
name: T1406 — Obfuscated Files or Information
description: Adversaries may attempt to make a payload or file difficult to discover
  or analyze by encrypting, encoding, or otherwise obfuscating its contents on the
  device or in transit. This is common behavior that can be used across different
  platforms and the network to evade defenses.
