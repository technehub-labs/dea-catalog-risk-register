id: dea:risk-defense-impairment-t1599-network-boundary-bridgi-9kaja5
type: Risk
name: T1599 — Network Boundary Bridging
description: Adversaries may bridge network boundaries by compromising perimeter network
  devices or internal devices responsible for network segmentation. Breaching these
  devices may enable an adversary to bypass restrictions on traffic routing that otherwise
  separate trusted and untrusted networks.
