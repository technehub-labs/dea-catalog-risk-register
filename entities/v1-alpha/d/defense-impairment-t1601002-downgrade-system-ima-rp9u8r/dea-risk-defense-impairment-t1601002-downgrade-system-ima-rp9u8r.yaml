id: dea:risk-defense-impairment-t1601002-downgrade-system-ima-rp9u8r
type: Risk
name: T1601.002 — Downgrade System Image
description: Adversaries may install an older version of the operating system of a
  network device to weaken security. Older operating system versions on network devices
  often have weaker encryption ciphers and, in general, fewer/less updated defensive
  features.
