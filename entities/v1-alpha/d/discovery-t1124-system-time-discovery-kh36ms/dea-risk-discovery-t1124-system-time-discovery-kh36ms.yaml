id: dea:risk-discovery-t1124-system-time-discovery-kh36ms
type: Risk
name: T1124 — System Time Discovery
description: An adversary may gather the system time and/or time zone settings from
  a local or remote system. The system time is set and stored by services, such as
  the Windows Time Service on Windows or <code>systemsetup</code> on macOS.
