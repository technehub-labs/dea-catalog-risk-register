type: Risk
name: T1629.003 — Disable or Modify Tools
description: Adversaries may disable security tools to avoid potential detection of
  their tools and activities. This can take the form of disabling security software,
  modifying SELinux configuration, or other methods to interfere with security tools
  scanning or reporting information.
