id: dea:risk-defense-evasion-t1630001-uninstall-malicious-app-2msh5r
type: Risk
name: T1630.001 — Uninstall Malicious Application
description: 'Adversaries may include functionality in malware that uninstalls the
  malicious application from the device. This can be achieved by: * Abusing device
  owner permissions to perform silent uninstallation using device owner API calls.
  * Abusing root permissions to delete files from the filesystem.'
