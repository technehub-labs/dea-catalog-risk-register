id: dea:risk-discovery-t1057-process-discovery-pxhcvf
type: Risk
name: T1057 — Process Discovery
description: Adversaries may attempt to get information about running processes on
  a system. Information obtained could be used to gain an understanding of common
  software/applications running on systems within the network. Administrator or otherwise
  elevated access may provide better process details.
