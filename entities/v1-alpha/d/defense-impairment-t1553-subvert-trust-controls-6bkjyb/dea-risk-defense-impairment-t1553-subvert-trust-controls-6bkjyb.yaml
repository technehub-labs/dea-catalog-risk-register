id: dea:risk-defense-impairment-t1553-subvert-trust-controls-6bkjyb
type: Risk
name: T1553 — Subvert Trust Controls
description: Adversaries may undermine security controls that will either warn users
  of untrusted activity or prevent execution of untrusted programs. Operating systems
  and security products may contain mechanisms to identify programs or websites as
  possessing some level of trust.
