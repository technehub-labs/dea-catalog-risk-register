id: dea:risk-defense-evasion-t1655-masquerading-c5xfq6
type: Risk
name: T1655 — Masquerading
description: Adversaries may attempt to manipulate features of their artifacts to
  make them appear legitimate or benign to users and/or security tools. Masquerading
  occurs when the name, location, or appearance of an object, legitimate or malicious,
  is manipulated or abused for the sake of evading defenses and observation.
