type: Risk
name: T1630.002 — File Deletion
description: Adversaries may wipe a device or delete individual files in order to
  manipulate external outcomes or hide activity. An application must have administrator
  access to fully wipe the device, while individual files may not require special
  permissions to delete depending on their storage location.
