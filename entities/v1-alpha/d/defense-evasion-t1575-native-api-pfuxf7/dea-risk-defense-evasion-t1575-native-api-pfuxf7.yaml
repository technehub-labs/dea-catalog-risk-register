id: dea:risk-defense-evasion-t1575-native-api-pfuxf7
type: Risk
name: T1575 — Native API
description: Adversaries may use Android’s Native Development Kit (NDK) to write native
  functions that can achieve execution of binaries or functions. Like system calls
  on a traditional desktop operating system, native code achieves execution on a lower
  level than normal Android SDK calls.
