id: dea:risk-defense-impairment-t1556005-reversible-encryptio-m8htut
type: Risk
name: T1556.005 — Reversible Encryption
description: An adversary may abuse Active Directory authentication encryption properties
  to gain access to credentials on Windows systems. The <code>AllowReversiblePasswordEncryption</code>
  property specifies whether reversible password encryption for an account is enabled
  or disabled.
