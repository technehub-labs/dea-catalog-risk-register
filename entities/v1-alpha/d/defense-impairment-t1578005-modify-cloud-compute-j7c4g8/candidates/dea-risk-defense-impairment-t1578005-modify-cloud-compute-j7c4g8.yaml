id: dea:risk-defense-impairment-t1578005-modify-cloud-compute-j7c4g8
type: Risk
name: T1578.005 — Modify Cloud Compute Configurations
description: Adversaries may modify settings that directly affect the size, locations,
  and resources available to cloud compute infrastructure in order to evade defenses.
  These settings may include service quotas, subscription associations, tenant-wide
  policies, or other configurations that impact available compute.
