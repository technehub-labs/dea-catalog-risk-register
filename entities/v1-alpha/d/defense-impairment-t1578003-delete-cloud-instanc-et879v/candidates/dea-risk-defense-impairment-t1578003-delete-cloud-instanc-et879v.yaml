id: dea:risk-defense-impairment-t1578003-delete-cloud-instanc-et879v
type: Risk
name: T1578.003 — Delete Cloud Instance
description: An adversary may delete a cloud instance after they have performed malicious
  activities in an attempt to evade detection and remove evidence of their presence.
  Deleting an instance or virtual machine can remove valuable forensic artifacts and
  other evidence of suspicious behavior if the instance is not recoverable.
