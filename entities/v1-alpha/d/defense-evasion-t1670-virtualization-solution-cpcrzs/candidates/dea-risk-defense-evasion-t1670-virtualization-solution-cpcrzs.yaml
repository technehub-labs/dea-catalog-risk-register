id: dea:risk-defense-evasion-t1670-virtualization-solution-cpcrzs
type: Risk
name: T1670 — Virtualization Solution
description: Adversaries may carry out malicious operations using virtualization solutions
  to escape from Android sandboxes and to avoid detection. Android uses sandboxes
  to separate resources and code execution between applications and the operating
  system.
