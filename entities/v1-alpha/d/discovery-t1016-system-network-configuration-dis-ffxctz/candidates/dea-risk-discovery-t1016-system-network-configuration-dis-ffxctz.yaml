id: dea:risk-discovery-t1016-system-network-configuration-dis-ffxctz
type: Risk
name: T1016 — System Network Configuration Discovery
description: Adversaries may look for details about the network configuration and
  settings, such as IP and/or MAC addresses, of systems they access or through information
  discovery of remote systems. Several operating system administration utilities exist
  that can be used to gather this information.
