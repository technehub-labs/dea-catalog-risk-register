id: dea:risk-defense-evasion-t1604-proxy-through-victim-bcybtw
type: Risk
name: T1604 — Proxy Through Victim
description: Adversaries may use a compromised device as a proxy server to the Internet.
  By utilizing a proxy, adversaries hide the true IP address of their C2 server and
  associated infrastructure from the destination of the network traffic.
