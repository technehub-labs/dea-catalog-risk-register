id: dea:risk-discovery-t0888-remote-system-information-discov-teagtx
type: Risk
name: T0888 — Remote System Information Discovery
description: An adversary may attempt to get detailed information about remote systems
  and their peripherals, such as make/model, role, and configuration. Adversaries
  may use information from Remote System Information Discovery to aid in targeting
  and shaping follow-on behaviors.
