id: dea:risk-discovery-t0846002-broadcast-discovery-9ehsry
type: Risk
name: T0846.002 — Broadcast Discovery
description: Adversaries may perform broadcast discovery requests to enumerate systems
  and devices on a network. Broadcast discovery works by one system or device sending
  messages to all systems and devices on a network (or subnet) and then waiting for
  a response.
