id: dea:risk-defense-impairment-t1666-modify-cloud-resource-h-bv83q4
type: Risk
name: T1666 — Modify Cloud Resource Hierarchy
description: Adversaries may attempt to modify hierarchical structures in infrastructure-as-a-service
  (IaaS) environments in order to evade defenses. IaaS environments often group resources
  into a hierarchy, enabling improved resource management and application of policies
  to relevant groups.
