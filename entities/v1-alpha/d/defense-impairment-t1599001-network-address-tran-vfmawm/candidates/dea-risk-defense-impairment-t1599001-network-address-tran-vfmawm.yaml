id: dea:risk-defense-impairment-t1599001-network-address-tran-vfmawm
type: Risk
name: T1599.001 — Network Address Translation Traversal
description: Adversaries may bridge network boundaries by modifying a network device’s
  Network Address Translation (NAT) configuration. Malicious modifications to NAT
  may enable an adversary to bypass restrictions on traffic routing that otherwise
  separate trusted and untrusted networks.
