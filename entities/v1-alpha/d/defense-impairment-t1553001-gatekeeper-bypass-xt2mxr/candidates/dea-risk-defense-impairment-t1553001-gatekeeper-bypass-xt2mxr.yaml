id: dea:risk-defense-impairment-t1553001-gatekeeper-bypass-xt2mxr
type: Risk
name: T1553.001 — Gatekeeper Bypass
description: Adversaries may modify file attributes and subvert Gatekeeper functionality
  to evade user prompts and execute untrusted programs. Gatekeeper is a set of technologies
  that act as layer of Apple’s security model to ensure only trusted applications
  are executed on a host.
