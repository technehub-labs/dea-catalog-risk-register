id: dea:risk-defense-impairment-t1601001-patch-system-image-35mp6g
type: Risk
name: T1601.001 — Patch System Image
description: Adversaries may modify the operating system of a network device to introduce
  new capabilities or weaken existing defenses. Some network devices are built with
  a monolithic architecture, where the entire operating system and most of the functionality
  of the device is contained within a single file.
