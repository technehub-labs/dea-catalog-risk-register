id: dea:risk-discovery-t1087001-local-account-gcns5s
type: Risk
name: T1087.001 — Local Account
description: Adversaries may attempt to get a listing of local system accounts. This
  information can help adversaries determine which local accounts exist on a system
  to aid in follow-on behavior. Commands such as <code>net user</code> and <code>net
  localgroup</code> of the [Net](https://attack.mitre.
