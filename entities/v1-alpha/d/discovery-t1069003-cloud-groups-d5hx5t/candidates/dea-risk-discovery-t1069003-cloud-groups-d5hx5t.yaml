id: dea:risk-discovery-t1069003-cloud-groups-d5hx5t
type: Risk
name: T1069.003 — Cloud Groups
description: Adversaries may attempt to find cloud groups and permission settings.
  The knowledge of cloud permission groups can help adversaries determine the particular
  roles of users and groups within an environment, as well as which users are associated
  with a particular group.
