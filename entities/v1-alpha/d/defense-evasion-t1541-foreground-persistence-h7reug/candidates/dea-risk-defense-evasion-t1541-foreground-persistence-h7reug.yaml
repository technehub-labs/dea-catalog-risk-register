id: dea:risk-defense-evasion-t1541-foreground-persistence-h7reug
type: Risk
name: T1541 — Foreground Persistence
description: Adversaries may abuse Android's `startForeground()` API method to maintain
  continuous sensor access. Beginning in Android 9, idle applications running in the
  background no longer have access to device sensors, such as the camera, microphone,
  and gyroscope.
