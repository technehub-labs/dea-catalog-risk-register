id: dea:risk-defense-impairment-t1686-disable-or-modify-syste-7zyn2j
type: Risk
name: T1686 — Disable or Modify System Firewall
description: Adversaries may disable or modify host-based or network firewalls to
  impair defensive mechanisms and enable further action. Once an adversary has gathered
  sufficient privileges, they can tamper with firewall services, policies, or rule
  sets to remove restrictions on inbound or outbound traffic.
