type: Risk
name: T1550.001 — Application Access Token
description: Adversaries may use stolen application access tokens to bypass the typical
  authentication process and access restricted accounts, information, or services
  on remote systems. These tokens are typically stolen from users or services and
  used in lieu of login credentials.
