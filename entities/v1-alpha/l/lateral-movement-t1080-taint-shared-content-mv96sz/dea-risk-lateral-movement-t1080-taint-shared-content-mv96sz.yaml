id: dea:risk-lateral-movement-t1080-taint-shared-content-mv96sz
type: Risk
name: T1080 — Taint Shared Content
description: Adversaries may deliver payloads to remote systems by adding content
  to shared storage locations, such as network drives or internal code repositories.
  Content stored on network drives or in other shared locations may be tainted by
  adding malicious programs, scripts, or exploit code to otherwise valid files.
