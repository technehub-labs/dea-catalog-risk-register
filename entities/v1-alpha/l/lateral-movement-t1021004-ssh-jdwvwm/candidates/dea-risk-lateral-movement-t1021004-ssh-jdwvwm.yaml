id: dea:risk-lateral-movement-t1021004-ssh-jdwvwm
type: Risk
name: T1021.004 — SSH
description: Adversaries may use [Valid Accounts](https://attack.mitre.org/techniques/T1078)
  to log into remote machines using Secure Shell (SSH). The adversary may then perform
  actions as the logged-on user. SSH is a protocol that allows authorized users to
  open remote shells on other computers.
