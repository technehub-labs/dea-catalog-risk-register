id: dea:risk-lateral-movement-t1550002-pass-the-hash-q5r9h2
type: Risk
name: T1550.002 — Pass the Hash
description: Adversaries may “pass the hash” using stolen password hashes to move
  laterally within an environment, bypassing normal system access controls. Pass the
  hash (PtH) is a method of authenticating as a user without having access to the
  user's cleartext password.
