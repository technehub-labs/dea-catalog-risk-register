id: dea:risk-lateral-movement-t1563-remote-service-session-hi-59468q
type: Risk
name: T1563 — Remote Service Session Hijacking
description: Adversaries may take control of preexisting sessions with remote services
  to move laterally in an environment. Users may use valid credentials to log into
  a service specifically designed to accept remote connections, such as telnet, SSH,
  and RDP.
