id: dea:risk-lateral-movement-t1550003-pass-the-ticket-8qncng
type: Risk
name: T1550.003 — Pass the Ticket
description: Adversaries may “pass the ticket” using stolen Kerberos tickets to move
  laterally within an environment, bypassing normal system access controls. Pass the
  ticket (PtT) is a method of authenticating to a system using Kerberos tickets without
  having access to an account's password.
