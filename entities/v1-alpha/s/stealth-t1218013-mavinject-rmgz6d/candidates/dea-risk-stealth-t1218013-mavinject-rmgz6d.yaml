id: dea:risk-stealth-t1218013-mavinject-rmgz6d
type: Risk
name: T1218.013 — Mavinject
description: Adversaries may abuse mavinject.exe to proxy execution of malicious code.
  Mavinject.exe is the Microsoft Application Virtualization Injector, a Windows utility
  that can inject code into external processes as part of Microsoft Application Virtualization
  (App-V). Adversaries may abuse mavinject.
