id: dea:risk-stealth-t1542-pre-os-boot-wyevxh
type: Risk
name: T1542 — Pre-OS Boot
description: Adversaries may abuse Pre-OS Boot mechanisms as a way to establish persistence
  on a system. During the booting process of a computer, firmware and various startup
  services are loaded before the operating system. These programs control flow of
  execution before the operating system takes control.
