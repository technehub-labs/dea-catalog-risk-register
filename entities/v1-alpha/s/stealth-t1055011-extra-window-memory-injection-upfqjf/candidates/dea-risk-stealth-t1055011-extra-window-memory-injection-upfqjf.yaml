id: dea:risk-stealth-t1055011-extra-window-memory-injection-upfqjf
type: Risk
name: T1055.011 — Extra Window Memory Injection
description: Adversaries may inject malicious code into a process via Extra Window
  Memory (EWM) in order to evade process-based defenses as well as possibly elevate
  privileges. EWM injection is a method of executing arbitrary code in the address
  space of a separate live process.
