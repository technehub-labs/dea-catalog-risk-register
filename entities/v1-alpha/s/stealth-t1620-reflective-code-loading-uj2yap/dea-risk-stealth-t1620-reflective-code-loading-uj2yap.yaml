id: dea:risk-stealth-t1620-reflective-code-loading-uj2yap
type: Risk
name: T1620 — Reflective Code Loading
description: Adversaries may reflectively load code into a process in order to conceal
  the execution of malicious payloads. Reflective loading involves allocating then
  executing payloads directly within the memory of the process, vice creating a thread
  or process backed by a file path on disk (e.g., [Shared Modules](https://attack.
