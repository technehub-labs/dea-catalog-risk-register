id: dea:risk-stealth-t1218012-verclsid-f6pcqp
type: Risk
name: T1218.012 — Verclsid
description: Adversaries may abuse verclsid.exe to proxy execution of malicious code.
  Verclsid.exe is known as the Extension CLSID Verification Host and is responsible
  for verifying each shell extension before they are used by Windows Explorer or the
  Windows Shell. Adversaries may abuse verclsid.exe to execute malicious payloads.
