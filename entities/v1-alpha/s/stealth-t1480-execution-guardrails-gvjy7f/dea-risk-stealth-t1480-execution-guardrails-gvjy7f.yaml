id: dea:risk-stealth-t1480-execution-guardrails-gvjy7f
type: Risk
name: T1480 — Execution Guardrails
description: Adversaries may use execution guardrails to constrain execution or actions
  based on adversary supplied and environment specific conditions that are expected
  to be present on the target. Guardrails ensure that a payload only executes against
  an intended target and reduces collateral damage from an adversary’s campaign.
