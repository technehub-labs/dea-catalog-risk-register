id: dea:risk-stealth-t1696-anti-automation-evasion-h3ugna
type: Risk
name: T1696 — Anti-Automation Evasion
description: Adversaries may employ various means to evade or complete automation
  checks. Automation checks distinguish human users from bot traffic and prevent bots
  from reaching the web pages protected by automation checks. For example, a user
  may be required to solve a CAPTCHA challenge before accessing a form or login page.
