id: dea:risk-stealth-t1218009-regsvcs-regasm-zp6ber
type: Risk
name: T1218.009 — Regsvcs/Regasm
description: Adversaries may abuse Regsvcs and Regasm to proxy execution of code through
  a trusted Windows utility. Regsvcs and Regasm are Windows command-line utilities
  that are used to register .NET [Component Object Model](https://attack.mitre.org/techniques/T1559/001)
  (COM) assemblies.
