id: dea:risk-stealth-t1564002-hidden-users-s4jwv9
type: Risk
name: T1564.002 — Hidden Users
description: Adversaries may use hidden users to hide the presence of user accounts
  they create or modify. Administrators may want to hide users when there are many
  user accounts on a given system or if they want to hide their administrative or
  other management accounts from other users.
