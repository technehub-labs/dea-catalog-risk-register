id: dea:risk-stealth-t1564008-email-hiding-rules-dgsgfm
type: Risk
name: T1564.008 — Email Hiding Rules
description: Adversaries may use email rules to hide inbound emails in a compromised
  user's mailbox. Many email clients allow users to create inbox rules for various
  email functions, including moving emails to other folders, marking emails as read,
  or deleting emails.
