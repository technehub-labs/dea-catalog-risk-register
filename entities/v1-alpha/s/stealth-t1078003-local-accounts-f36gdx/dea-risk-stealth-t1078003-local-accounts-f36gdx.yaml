id: dea:risk-stealth-t1078003-local-accounts-f36gdx
type: Risk
name: T1078.003 — Local Accounts
description: Adversaries may obtain and abuse credentials of a local account as a
  means of gaining Initial Access, Persistence, Privilege Escalation, or Defense Evasion.
  Local accounts are those configured by an organization for use by users, remote
  support, services, or for administration on a single system or service.
