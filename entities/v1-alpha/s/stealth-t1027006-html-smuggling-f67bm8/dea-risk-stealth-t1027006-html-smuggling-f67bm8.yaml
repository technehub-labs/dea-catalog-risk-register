id: dea:risk-stealth-t1027006-html-smuggling-f67bm8
type: Risk
name: T1027.006 — HTML Smuggling
description: Adversaries may smuggle data and files past content filters by hiding
  malicious payloads inside of seemingly benign HTML files. HTML documents can store
  large binary objects known as JavaScript Blobs (immutable data that represents raw
  bytes) that can later be constructed into file-like objects.
