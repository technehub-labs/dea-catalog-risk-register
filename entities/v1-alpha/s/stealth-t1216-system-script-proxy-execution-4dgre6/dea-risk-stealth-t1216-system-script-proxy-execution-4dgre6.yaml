id: dea:risk-stealth-t1216-system-script-proxy-execution-4dgre6
type: Risk
name: T1216 — System Script Proxy Execution
description: Adversaries may use trusted scripts, often signed with certificates,
  to proxy the execution of malicious files. Several Microsoft signed scripts that
  have been downloaded from Microsoft or are default on Windows installations can
  be used to proxy execution of other files.
