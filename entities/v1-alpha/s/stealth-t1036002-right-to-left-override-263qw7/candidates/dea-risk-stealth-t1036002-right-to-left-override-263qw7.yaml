id: dea:risk-stealth-t1036002-right-to-left-override-263qw7
type: Risk
name: T1036.002 — Right-to-Left Override
description: Adversaries may abuse the right-to-left override (RTLO or RLO) character
  (U+202E) to disguise a string and/or file name to make it appear benign. RTLO is
  a non-printing Unicode character that causes the text that follows it to be displayed
  in reverse.
