id: dea:risk-stealth-t1055013-process-doppelg-nging-mh5qjm
type: Risk
name: T1055.013 — Process Doppelgänging
description: Adversaries may inject malicious code into a process via process doppelgänging
  in order to evade process-based defenses as well as possibly elevate privileges.
  Process doppelgänging is a method of executing arbitrary code in the address space
  of a separate live process.
