id: dea:risk-stealth-t1055015-listplanting-kaqwdz
type: Risk
name: T1055.015 — ListPlanting
description: Adversaries may abuse list-view controls to inject malicious code into
  hijacked processes in order to evade process-based defenses as well as possibly
  elevate privileges. ListPlanting is a method of executing arbitrary code in the
  address space of a separate live process.
