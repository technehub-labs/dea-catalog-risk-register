id: dea:risk-stealth-t1218008-odbcconf-8gk5w3
type: Risk
name: T1218.008 — Odbcconf
description: Adversaries may abuse odbcconf.exe to proxy execution of malicious payloads.
  Odbcconf.exe is a Windows utility that allows you to configure Open Database Connectivity
  (ODBC) drivers and data source names. The Odbcconf.exe binary may be digitally signed
  by Microsoft. Adversaries may abuse odbcconf.
