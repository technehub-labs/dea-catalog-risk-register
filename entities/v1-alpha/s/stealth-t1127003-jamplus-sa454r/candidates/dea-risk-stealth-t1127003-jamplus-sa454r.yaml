id: dea:risk-stealth-t1127003-jamplus-sa454r
type: Risk
name: T1127.003 — JamPlus
description: Adversaries may use `JamPlus` to proxy the execution of a malicious script.
  `JamPlus` is a build utility tool for code and data build systems. It works with
  several popular compilers and can be used for generating workspaces in code editors
  such as Visual Studio.
