type: Risk
name: T1542.001 — System Firmware
description: Adversaries may modify system firmware to persist on systems.The BIOS
  (Basic Input/Output System) and The Unified Extensible Firmware Interface (UEFI)
  or Extensible Firmware Interface (EFI) are examples of system firmware that operate
  as the software interface between the operating system and hardware of a computer.
