id: dea:risk-stealth-t1564009-resource-forking-7zbfeg
type: Risk
name: T1564.009 — Resource Forking
description: Adversaries may abuse resource forks to hide malicious code or executables
  to evade detection and bypass security applications. A resource fork provides applications
  a structured way to store resources such as thumbnail images, menu definitions,
  icons, dialog boxes, and code.
