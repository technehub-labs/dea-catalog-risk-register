id: dea:risk-stealth-t1027018-invisible-unicode-v46fum
type: Risk
name: T1027.018 — Invisible Unicode
description: Adversaries may abuse invisible or non-printing Unicode characters to
  conceal malicious content within files, scripts, or text. By inserting characters
  that do not visibly render, adversaries may hide data, alter how content is interpreted,
  or make malicious code appear as benign text or whitespace.
