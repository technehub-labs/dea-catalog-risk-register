id: dea:risk-stealth-t1197-bits-jobs-gcfxa9
type: Risk
name: T1197 — BITS Jobs
description: Adversaries may abuse BITS jobs to persistently execute code and perform
  various background tasks. Windows Background Intelligent Transfer Service (BITS)
  is a low-bandwidth, asynchronous file transfer mechanism exposed through [Component
  Object Model](https://attack.mitre.org/techniques/T1559/001) (COM).
