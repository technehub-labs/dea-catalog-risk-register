id: dea:risk-stealth-t1564007-vba-stomping-qwk3sf
type: Risk
name: T1564.007 — VBA Stomping
description: Adversaries may hide malicious Visual Basic for Applications (VBA) payloads
  embedded within MS Office documents by replacing the VBA source code with benign
  data. MS Office documents with embedded VBA content store source code inside of
  module streams.
