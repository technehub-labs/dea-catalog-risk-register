id: dea:risk-stealth-t1134-access-token-manipulation-vmsusd
type: Risk
name: T1134 — Access Token Manipulation
description: Adversaries may modify access tokens to operate under a different user
  or system security context to perform actions and bypass access controls. Windows
  uses access tokens to determine the ownership of a running process.
