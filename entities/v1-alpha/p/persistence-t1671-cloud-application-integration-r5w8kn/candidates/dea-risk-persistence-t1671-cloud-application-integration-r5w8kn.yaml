id: dea:risk-persistence-t1671-cloud-application-integration-r5w8kn
type: Risk
name: T1671 — Cloud Application Integration
description: Adversaries may achieve persistence by leveraging OAuth application integrations
  in a software-as-a-service environment. Adversaries may create a custom application,
  add a legitimate application into the environment, or even co-opt an existing integration
  to achieve malicious ends.
