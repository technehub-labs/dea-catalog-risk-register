id: dea:risk-persistence-t1398-boot-or-logon-initialization-s-ps459r
type: Risk
name: T1398 — Boot or Logon Initialization Scripts
description: Adversaries may use scripts automatically executed at boot or logon initialization
  to establish persistence. Initialization scripts are part of the underlying operating
  system and are not accessible to the user unless the device has been rooted or jailbroken.
