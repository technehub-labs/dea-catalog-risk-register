id: dea:risk-persistence-t1137001-office-template-macros-fbghgr
type: Risk
name: T1137.001 — Office Template Macros
description: Adversaries may abuse Microsoft Office templates to obtain persistence
  on a compromised system. Microsoft Office contains templates that are part of common
  Office applications and are used to customize styles. The base templates within
  the application are used each time an application starts.
