id: dea:risk-persistence-t1547010-port-monitors-gz4x4v
type: Risk
name: T1547.010 — Port Monitors
description: Adversaries may use port monitors to run an adversary supplied DLL during
  system boot for persistence or privilege escalation. A port monitor can be set through
  the <code>AddMonitor</code> API call to set a DLL to be loaded at startup.
