id: dea:risk-persistence-t1098007-additional-local-or-domain-tfyp8x
type: Risk
name: T1098.007 — Additional Local or Domain Groups
description: An adversary may add additional local or domain groups to an adversary-controlled
  account to maintain persistent access to a system or domain. On Windows, accounts
  may use the `net localgroup` and `net group` commands to add existing users to local
  and domain groups.
