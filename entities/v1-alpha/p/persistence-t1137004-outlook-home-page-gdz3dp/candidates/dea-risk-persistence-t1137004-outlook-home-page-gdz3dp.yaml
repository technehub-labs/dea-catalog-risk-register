id: dea:risk-persistence-t1137004-outlook-home-page-gdz3dp
type: Risk
name: T1137.004 — Outlook Home Page
description: Adversaries may abuse Microsoft Outlook's Home Page feature to obtain
  persistence on a compromised system. Outlook Home Page is a legacy feature used
  to customize the presentation of Outlook folders. This feature allows for an internal
  or external URL to be loaded and presented whenever a folder is opened.
