id: dea:risk-persistence-t1547007-re-opened-applications-9hx285
type: Risk
name: T1547.007 — Re-opened Applications
description: Adversaries may modify plist files to automatically run an application
  when a user logs in. When a user logs out or restarts via the macOS Graphical User
  Interface (GUI), a prompt is provided to the user with a checkbox to "Reopen windows
  when logging back in".
