id: dea:risk-persistence-t1547-boot-or-logon-autostart-execut-ez7tb9
type: Risk
name: T1547 — Boot or Logon Autostart Execution
description: Adversaries may configure system settings to automatically execute a
  program during system boot or logon to maintain persistence or gain higher-level
  privileges on compromised systems. Operating systems may have mechanisms for automatically
  running a program on system boot or account logon.
