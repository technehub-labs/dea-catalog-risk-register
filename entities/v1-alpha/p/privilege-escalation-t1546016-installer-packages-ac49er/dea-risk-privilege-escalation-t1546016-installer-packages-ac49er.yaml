id: dea:risk-privilege-escalation-t1546016-installer-packages-ac49er
type: Risk
name: T1546.016 — Installer Packages
description: Adversaries may establish persistence and elevate privileges by using
  an installer to trigger the execution of malicious content. Installer packages are
  OS specific and contain the resources an operating system needs to install applications
  on a system.
