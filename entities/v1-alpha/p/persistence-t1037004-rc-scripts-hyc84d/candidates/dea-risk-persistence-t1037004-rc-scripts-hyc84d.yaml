id: dea:risk-persistence-t1037004-rc-scripts-hyc84d
type: Risk
name: T1037.004 — RC Scripts
description: Adversaries may establish persistence by modifying RC scripts, which
  are executed during a Unix-like system’s startup. These files allow system administrators
  to map and start custom services at startup for different run levels. RC scripts
  require root privileges to modify.
