id: dea:risk-privilege-escalation-t1548004-elevated-execution-swg7z7
type: Risk
name: T1548.004 — Elevated Execution with Prompt
description: Adversaries may leverage the <code>AuthorizationExecuteWithPrivileges</code>
  API to escalate privileges by prompting the user for credentials. The purpose of
  this API is to give application developers an easy way to perform operations with
  root privileges, such as for application installation or updating.
