id: dea:risk-persistence-t1547015-login-items-8aamta
type: Risk
name: T1547.015 — Login Items
description: Adversaries may add login items to execute upon user login to gain persistence
  or escalate privileges. Login items are applications, documents, folders, or server
  connections that are automatically launched when a user logs in. Login items can
  be added via a shared file list or Service Management Framework.
