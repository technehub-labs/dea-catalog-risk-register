id: dea:risk-persistence-t1505001-sql-stored-procedures-vxsmqr
type: Risk
name: T1505.001 — SQL Stored Procedures
description: Adversaries may abuse SQL stored procedures to establish persistent access
  to systems. SQL Stored Procedures are code that can be saved and reused so that
  database users do not waste time rewriting frequently used SQL queries.
