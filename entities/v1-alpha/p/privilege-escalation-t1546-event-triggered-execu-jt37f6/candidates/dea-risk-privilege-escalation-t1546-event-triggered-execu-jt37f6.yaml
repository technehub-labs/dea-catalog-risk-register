id: dea:risk-privilege-escalation-t1546-event-triggered-execu-jt37f6
type: Risk
name: T1546 — Event Triggered Execution
description: Adversaries may establish persistence and/or elevate privileges using
  system mechanisms that trigger execution based on specific events. Various operating
  systems have means to monitor and subscribe to events such as logons or other user
  activity such as running specific applications/binaries.
