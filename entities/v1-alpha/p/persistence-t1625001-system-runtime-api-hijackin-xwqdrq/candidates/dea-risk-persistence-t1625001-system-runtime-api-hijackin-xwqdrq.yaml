type: Risk
name: T1625.001 — System Runtime API Hijacking
description: Adversaries may execute their own malicious payloads by hijacking the
  way an operating system runs applications. Hijacking execution flow can be for the
  purposes of persistence since this hijacked execution may reoccur at later points
  in time.
