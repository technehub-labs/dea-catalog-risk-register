name: T1546.004 — Unix Shell Configuration Modification
description: Adversaries may establish persistence through executing malicious commands
  triggered by a user’s shell. User [Unix Shell](https://attack.mitre.org/techniques/T1059/004)s
  execute several configuration scripts at different points throughout the session
  based on events.
