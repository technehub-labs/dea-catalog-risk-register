id: dea:risk-persistence-t1577-compromise-application-executa-cdr7hz
type: Risk
name: T1577 — Compromise Application Executable
description: Adversaries may modify applications installed on a device to establish
  persistent access to a victim. These malicious modifications can be used to make
  legitimate applications carry out adversary tasks when these applications are in
  use. There are multiple ways an adversary can inject malicious code into applications.
