id: dea:risk-persistence-t1547003-time-providers-u5cztm
type: Risk
name: T1547.003 — Time Providers
description: Adversaries may abuse time providers to execute DLLs when the system
  boots. The Windows Time service (W32Time) enables time synchronization across and
  within domains. W32Time time providers are responsible for retrieving time stamps
  from hardware/network resources and outputting these values to other network clients.
