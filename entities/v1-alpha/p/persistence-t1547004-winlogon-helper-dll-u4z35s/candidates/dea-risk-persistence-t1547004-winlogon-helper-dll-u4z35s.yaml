id: dea:risk-persistence-t1547004-winlogon-helper-dll-u4z35s
type: Risk
name: T1547.004 — Winlogon Helper DLL
description: Adversaries may abuse features of Winlogon to execute DLLs and/or executables
  when a user logs in. Winlogon.exe is a Windows component responsible for actions
  at logon/logoff as well as the secure attention sequence (SAS) triggered by Ctrl-Alt-Delete.
