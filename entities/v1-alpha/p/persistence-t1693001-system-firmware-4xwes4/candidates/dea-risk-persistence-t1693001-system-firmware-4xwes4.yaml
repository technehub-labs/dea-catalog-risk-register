id: dea:risk-persistence-t1693001-system-firmware-4xwes4
type: Risk
name: T1693.001 — System Firmware
description: System firmware on modern assets is often designed with an update feature.
  Older device firmware may be factory installed and require special reprograming
  equipment. When available, the firmware update feature enables vendors to remotely
  patch bugs and perform upgrades.
