id: dea:risk-privilege-escalation-t1546014-emond-wwddqr
type: Risk
name: T1546.014 — Emond
description: Adversaries may gain persistence and elevate privileges by executing
  malicious content triggered by the Event Monitor Daemon (emond). Emond is a [Launch
  Daemon](https://attack.mitre.org/techniques/T1543/004) that accepts events from
  various services, runs them through a simple rules engine, and takes action.
