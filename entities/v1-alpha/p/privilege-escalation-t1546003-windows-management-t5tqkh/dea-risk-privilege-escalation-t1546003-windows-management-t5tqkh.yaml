id: dea:risk-privilege-escalation-t1546003-windows-management-t5tqkh
type: Risk
name: T1546.003 — Windows Management Instrumentation Event Subscription
description: Adversaries may establish persistence and elevate privileges by executing
  malicious content triggered by a Windows Management Instrumentation (WMI) event
  subscription. WMI can be used to install event filters, providers, consumers, and
  bindings that execute code when a defined event occurs.
