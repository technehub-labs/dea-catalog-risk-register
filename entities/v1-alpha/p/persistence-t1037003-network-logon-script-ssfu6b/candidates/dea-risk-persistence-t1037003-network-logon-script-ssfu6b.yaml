id: dea:risk-persistence-t1037003-network-logon-script-ssfu6b
type: Risk
name: T1037.003 — Network Logon Script
description: Adversaries may use network logon scripts automatically executed at logon
  initialization to establish persistence. Network logon scripts can be assigned using
  Active Directory or Group Policy Objects. These logon scripts run with the privileges
  of the user they are assigned to.
