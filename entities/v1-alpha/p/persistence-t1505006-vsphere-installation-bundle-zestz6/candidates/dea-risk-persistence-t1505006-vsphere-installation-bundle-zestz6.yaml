id: dea:risk-persistence-t1505006-vsphere-installation-bundle-zestz6
type: Risk
name: T1505.006 — vSphere Installation Bundles
description: Adversaries may abuse vSphere Installation Bundles (VIBs) to establish
  persistent access to ESXi hypervisors. VIBs are collections of files used for software
  distribution and virtual system management in VMware environments.
