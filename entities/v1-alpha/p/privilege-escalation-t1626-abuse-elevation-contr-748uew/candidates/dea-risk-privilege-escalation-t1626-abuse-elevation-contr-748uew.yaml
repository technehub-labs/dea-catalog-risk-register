id: dea:risk-privilege-escalation-t1626-abuse-elevation-contr-748uew
type: Risk
name: T1626 — Abuse Elevation Control Mechanism
description: Adversaries may circumvent mechanisms designed to control elevated privileges
  to gain higher-level permissions. Most modern systems contain native elevation control
  mechanisms that are intended to limit privileges that a user can gain on a machine.
