name: T1056.004 — Credential API Hooking
description: Adversaries may hook into Windows application programming interface (API)
  functions and Linux system functions to collect user credentials. Malicious hooking
  mechanisms may capture API or function calls that include parameters that reveal
  user authentication credentials. Unlike [Keylogging](https://attack.mitre.
