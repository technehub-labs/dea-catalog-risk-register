id: dea:risk-command-and-control-t1090003-multi-hop-proxy-mvmz8m
type: Risk
name: T1090.003 — Multi-hop Proxy
description: Adversaries may chain together multiple proxies to disguise the source
  of malicious traffic. Typically, a defender will be able to identify the last proxy
  traffic traversed before it enters their network; the defender may or may not be
  able to identify any previous proxies before the last-hop proxy.
