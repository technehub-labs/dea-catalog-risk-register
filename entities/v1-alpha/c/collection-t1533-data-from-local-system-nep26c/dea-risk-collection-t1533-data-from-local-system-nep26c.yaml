id: dea:risk-collection-t1533-data-from-local-system-nep26c
type: Risk
name: T1533 — Data from Local System
description: Adversaries may search local system sources, such as file systems or
  local databases, to find files of interest and sensitive data prior to exfiltration.
  Access to local system data, which includes information stored by the operating
  system, often requires escalated privileges.
