id: dea:risk-command-and-control-t1132002-non-standard-encodi-qxsexa
type: Risk
name: T1132.002 — Non-Standard Encoding
description: Adversaries may encode data with a non-standard data encoding system
  to make the content of command and control traffic more difficult to detect. Command
  and control (C2) information can be encoded using a non-standard data encoding system
  that diverges from existing protocol specifications.
