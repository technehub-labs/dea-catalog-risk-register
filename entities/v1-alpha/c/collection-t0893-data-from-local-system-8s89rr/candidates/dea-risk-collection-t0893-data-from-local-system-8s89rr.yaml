id: dea:risk-collection-t0893-data-from-local-system-8s89rr
type: Risk
name: T0893 — Data from Local System
description: Adversaries may target and collect data from local system sources, such
  as file systems, configuration files, or local databases. This can include sensitive
  data such as specifications, schematics, or diagrams of control system layouts,
  devices, and processes.
