id: dea:risk-collection-t1213003-code-repositories-ehjh3z
type: Risk
name: T1213.003 — Code Repositories
description: Adversaries may leverage code repositories to collect valuable information.
  Code repositories are tools/services that store source code and automate software
  builds. They may be hosted internally or privately on third party sites such as
  Github, GitLab, SourceForge, and BitBucket.
