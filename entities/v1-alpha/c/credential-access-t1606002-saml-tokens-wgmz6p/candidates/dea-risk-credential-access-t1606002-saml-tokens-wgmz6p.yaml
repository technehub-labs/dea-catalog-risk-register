id: dea:risk-credential-access-t1606002-saml-tokens-wgmz6p
type: Risk
name: T1606.002 — SAML Tokens
description: An adversary may forge SAML tokens with any permissions claims and lifetimes
  if they possess a valid SAML token-signing certificate. The default lifetime of
  a SAML token is one hour, but the validity period can be specified in the <code>NotOnOrAfter</code>
  value of the <code>conditions ...</code> element in a token.
