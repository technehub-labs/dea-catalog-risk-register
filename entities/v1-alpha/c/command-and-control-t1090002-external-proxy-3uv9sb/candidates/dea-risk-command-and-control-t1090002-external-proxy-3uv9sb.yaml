id: dea:risk-command-and-control-t1090002-external-proxy-3uv9sb
type: Risk
name: T1090.002 — External Proxy
description: Adversaries may use an external proxy to act as an intermediary for network
  communications to a command and control server to avoid direct connections to their
  infrastructure. Many tools exist that enable traffic redirection through proxies
  or port redirection, including [HTRAN](https://attack.mitre.
