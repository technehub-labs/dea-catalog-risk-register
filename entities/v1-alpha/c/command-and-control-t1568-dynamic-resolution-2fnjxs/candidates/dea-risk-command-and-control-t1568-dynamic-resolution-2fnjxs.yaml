id: dea:risk-command-and-control-t1568-dynamic-resolution-2fnjxs
type: Risk
name: T1568 — Dynamic Resolution
description: Adversaries may dynamically establish connections to command and control
  infrastructure to evade common detections and remediations. This may be achieved
  by using malware that shares a common algorithm with the infrastructure the adversary
  uses to receive the malware's communications.
