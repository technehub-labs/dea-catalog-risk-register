id: dea:risk-collection-t1414-clipboard-data-57ub9n
type: Risk
name: T1414 — Clipboard Data
description: Adversaries may abuse clipboard manager APIs to obtain sensitive information
  copied to the device clipboard. For example, passwords being copied and pasted from
  a password manager application could be captured by a malicious application installed
  on the device. On Android, applications can use the `ClipboardManager.
