id: dea:risk-credential-access-t1539-steal-web-session-cookie-rrmhkk
type: Risk
name: T1539 — Steal Web Session Cookie
description: An adversary may steal web application or service session cookies and
  use them to gain access to web applications or Internet services as an authenticated
  user without needing credentials. Web applications and services often use session
  cookies as an authentication token after a user has authenticated to a website.
