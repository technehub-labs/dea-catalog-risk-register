name: T0830 — Adversary-in-the-Middle
description: Adversaries with privileged network access may seek to modify network
  traffic in real time using adversary-in-the-middle (AiTM) attacks. This type of
  attack allows the adversary to intercept traffic to and/or from a particular device
  on the network.
