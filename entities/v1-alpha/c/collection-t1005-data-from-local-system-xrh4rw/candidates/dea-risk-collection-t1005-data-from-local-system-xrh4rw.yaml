id: dea:risk-collection-t1005-data-from-local-system-xrh4rw
type: Risk
name: T1005 — Data from Local System
description: Adversaries may search local system sources, such as file systems, configuration
  files, local databases, virtual machine files, or process memory, to find files
  of interest and sensitive data prior to Exfiltration. Adversaries may do this using
  a [Command and Scripting Interpreter](https://attack.mitre.
