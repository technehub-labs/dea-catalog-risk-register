id: dea:risk-collection-t1074002-remote-data-staging-ewnqav
type: Risk
name: T1074.002 — Remote Data Staging
description: Adversaries may stage data collected from multiple systems in a central
  location or directory on one system prior to Exfiltration. Data may be kept in separate
  files or combined into one file through techniques such as [Archive Collected Data](https://attack.mitre.org/techniques/T1560).
