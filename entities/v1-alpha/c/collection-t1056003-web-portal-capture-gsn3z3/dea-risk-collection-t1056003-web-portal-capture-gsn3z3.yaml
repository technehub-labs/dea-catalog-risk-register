id: dea:risk-collection-t1056003-web-portal-capture-gsn3z3
type: Risk
name: T1056.003 — Web Portal Capture
description: Adversaries may install code on externally facing portals, such as a
  VPN login page, to capture and transmit credentials of users who attempt to log
  into the service. For example, a compromised login page may log provided user credentials
  before logging the user in to the service.
