id: dea:risk-credential-access-t1003-os-credential-dumping-2ut6mf
type: Risk
name: T1003 — OS Credential Dumping
description: Adversaries may attempt to dump credentials to obtain account login and
  credential material, normally in the form of a hash or a clear text password. Credentials
  can be obtained from OS caches, memory, or structures. Credentials can then be used
  to perform [Lateral Movement](https://attack.mitre.
