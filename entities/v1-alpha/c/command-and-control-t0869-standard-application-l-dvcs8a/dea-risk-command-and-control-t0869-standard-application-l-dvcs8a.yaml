id: dea:risk-command-and-control-t0869-standard-application-l-dvcs8a
type: Risk
name: T0869 — Standard Application Layer Protocol
description: Adversaries may establish command and control capabilities over commonly
  used application layer protocols such as HTTP(S), OPC, RDP, telnet, DNP3, and modbus.
  These protocols may be used to disguise adversary actions as benign network traffic.
