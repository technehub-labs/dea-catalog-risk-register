id: dea:risk-credential-access-t1003005-cached-domain-credent-867t7e
type: Risk
name: T1003.005 — Cached Domain Credentials
description: Adversaries may attempt to access cached domain credentials used to allow
  authentication to occur in the event a domain controller is unavailable. On Windows
  Vista and newer, the hash format is DCC2 (Domain Cached Credentials version 2) hash,
  also known as MS-Cache v2 hash.
