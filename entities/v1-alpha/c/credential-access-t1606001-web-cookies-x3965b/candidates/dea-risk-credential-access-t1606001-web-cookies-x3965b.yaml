id: dea:risk-credential-access-t1606001-web-cookies-x3965b
type: Risk
name: T1606.001 — Web Cookies
description: Adversaries may forge web cookies that can be used to gain access to
  web applications or Internet services. Web applications and services (hosted in
  cloud SaaS environments or on-premise servers) often use session cookies to authenticate
  and authorize user access.
