id: dea:risk-credential-access-t1555004-windows-credential-ma-srxuzu
type: Risk
name: T1555.004 — Windows Credential Manager
description: Adversaries may acquire credentials from the Windows Credential Manager.
  The Credential Manager stores credentials for signing into websites, applications,
  and/or devices that request authentication through NTLM or Kerberos in Credential
  Lockers (previously known as Windows Vaults).
