type: Risk
name: T1114.003 — Email Forwarding Rule
description: Adversaries may set up email forwarding rules to collect sensitive information.
  Adversaries may abuse email forwarding rules to monitor the activities of a victim,
  steal information, and further gain intelligence on the victim or the victim’s organization
  to use as part of further exploits or operations.
