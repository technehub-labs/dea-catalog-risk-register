id: dea:risk-credential-access-t1558002-silver-ticket-cnz3p6
type: Risk
name: T1558.002 — Silver Ticket
description: Adversaries who have the password hash of a target service account (e.g.
  SharePoint, MSSQL) may forge Kerberos ticket granting service (TGS) tickets, also
  known as silver tickets. Kerberos TGS tickets are also known as service tickets.
