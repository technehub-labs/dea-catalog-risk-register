id: dea:risk-collection-t1636-protected-user-data-a98ypa
type: Risk
name: T1636 — Protected User Data
description: Adversaries may utilize standard operating system APIs to collect data
  from permission-backed data stores on a device, such as the calendar or contact
  list. These permissions need to be declared ahead of time. On Android, they must
  be included in the application’s manifest.
