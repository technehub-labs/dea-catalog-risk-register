id: dea:risk-credential-access-t1552003-shell-history-3zjc2t
type: Risk
name: T1552.003 — Shell History
description: Adversaries may search the command history on compromised systems for
  insecurely stored credentials. On Linux and macOS systems, shells such as Bash and
  Zsh keep track of the commands users type on the command-line with the "history"
  utility. Once a user logs out, the history is flushed to the user's history file.
