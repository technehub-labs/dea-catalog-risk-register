id: dea:risk-command-and-control-t1102002-bidirectional-commu-buqgk5
type: Risk
name: T1102.002 — Bidirectional Communication
description: Adversaries may use an existing, legitimate external Web service as a
  means for sending commands to and receiving output from a compromised system over
  the Web service channel. Compromised systems may leverage popular websites and social
  media to host command and control (C2) instructions.
