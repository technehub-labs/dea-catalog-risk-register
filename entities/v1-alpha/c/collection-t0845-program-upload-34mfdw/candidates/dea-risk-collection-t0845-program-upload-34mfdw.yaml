id: dea:risk-collection-t0845-program-upload-34mfdw
type: Risk
name: T0845 — Program Upload
description: Adversaries may attempt to upload a program from a PLC to gather information
  about an industrial process. Uploading a program may allow them to acquire and study
  the underlying logic. Methods of program upload include vendor software, which enables
  the user to upload and read a program running on a PLC.
