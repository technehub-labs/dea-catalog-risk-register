id: dea:risk-collection-t0868-detect-operating-mode-bc6j9j
type: Risk
name: T0868 — Detect Operating Mode
description: Adversaries may gather information about a PLCs or controllers current
  operating mode. Operating modes dictate what change or maintenance functions can
  be manipulated and are often controlled by a key switch on the PLC (e.g., run, prog
  [program], and remote).
