id: dea:risk-command-and-control-t1481001-dead-drop-resolver-qsxfen
type: Risk
name: T1481.001 — Dead Drop Resolver
description: Adversaries may use an existing, legitimate external Web service to host
  information that points to additional command and control (C2) infrastructure. Adversaries
  may post content, known as a dead drop resolver, on Web services with embedded (and
  often obfuscated/encoded) domains or IP addresses.
