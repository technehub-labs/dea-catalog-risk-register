id: dea:risk-credential-access-t1557001-name-resolution-poiso-mn77rr
type: Risk
name: T1557.001 — Name Resolution Poisoning and SMB Relay
description: By responding to LLMNR/NBT-NS/mDNS network traffic, adversaries may spoof
  an authoritative source for name resolution to force communication with an adversary
  controlled system. This activity may be used to collect or relay authentication
  materials.
