id: dea:risk-collection-t1114001-local-email-collection-p2j5yn
type: Risk
name: T1114.001 — Local Email Collection
description: Adversaries may target user email on local systems to collect sensitive
  information. Files containing email data can be acquired from a user’s local system,
  such as Outlook storage or cache files. Outlook stores data locally in offline data
  files with an extension of .ost. Outlook 2010 and later supports .
