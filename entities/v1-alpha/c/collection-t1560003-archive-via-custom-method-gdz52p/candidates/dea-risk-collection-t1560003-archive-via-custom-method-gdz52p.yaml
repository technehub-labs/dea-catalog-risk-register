id: dea:risk-collection-t1560003-archive-via-custom-method-gdz52p
type: Risk
name: T1560.003 — Archive via Custom Method
description: An adversary may compress or encrypt data that is collected prior to
  exfiltration using a custom method. Adversaries may choose to use custom archival
  methods, such as encryption with XOR or stream ciphers implemented with no external
  library or utility references.
