id: dea:risk-execution-t1675-esxi-administration-command-j6sgbt
type: Risk
name: T1675 — ESXi Administration Command
description: Adversaries may abuse ESXi administration services to execute commands
  on guest machines hosted within an ESXi virtual environment. Persistent background
  services on ESXi-hosted VMs, such as the VMware Tools Daemon Service, allow for
  remote management from the ESXi server. The tools daemon service runs as `vmtoolsd.
