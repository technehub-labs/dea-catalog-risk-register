id: dea:risk-exfiltration-t1567001-exfiltration-to-code-repos-t3sggs
type: Risk
name: T1567.001 — Exfiltration to Code Repository
description: 'Adversaries may exfiltrate data to a code repository rather than over
  their primary command and control channel. Code repositories are often accessible
  via an API (ex: https://api.github.com). Access to these APIs is often over HTTPS,
  which gives the adversary an additional level of protection.'
