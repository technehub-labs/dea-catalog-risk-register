id: dea:risk-execution-t0895-autorun-image-x56kab
type: Risk
name: T0895 — Autorun Image
description: Adversaries may leverage AutoRun functionality or scripts to execute
  malicious code. Devices configured to enable AutoRun functionality or legacy operating
  systems may be susceptible to abuse of these features to run malicious code stored
  on various forms of removeable media (i.e., USB, Disk Images [.ISO]).
