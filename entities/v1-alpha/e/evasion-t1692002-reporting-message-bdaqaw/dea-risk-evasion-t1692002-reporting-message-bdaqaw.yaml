id: dea:risk-evasion-t1692002-reporting-message-bdaqaw
type: Risk
name: T1692.002 — Reporting Message
description: Adversaries may spoof reporting messages in control system environments
  for evasion and to impair process control. In control systems, reporting messages
  contain telemetry data (e.g., I/O values) pertaining to the current state of equipment
  and the industrial process.
