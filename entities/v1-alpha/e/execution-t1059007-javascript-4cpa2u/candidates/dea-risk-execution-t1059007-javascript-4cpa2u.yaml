type: Risk
name: T1059.007 — JavaScript
description: Adversaries may abuse various implementations of JavaScript for execution.
  JavaScript (JS) is a platform-independent scripting language (compiled just-in-time
  at runtime) commonly associated with scripts in webpages, though JS can be executed
  in runtime environments outside the browser.
