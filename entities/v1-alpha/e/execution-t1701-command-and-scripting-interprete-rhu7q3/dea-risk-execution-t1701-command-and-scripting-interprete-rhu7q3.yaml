name: T1701 — Command and Scripting Interpreter
description: Adversaries may abuse command and script interpreters to execute commands,
  scripts, or binaries. These interfaces and languages provide ways of interacting
  with computer systems and are a common feature across many different platforms within
  industrial control system environments.
