id: dea:risk-execution-t0871-execution-through-api-49z8ee
type: Risk
name: T0871 — Execution through API
description: Adversaries may attempt to leverage Application Program Interfaces (APIs)
  used for communication between control software and the hardware. Specific functionality
  is often coded into APIs which can be called by software to engage specific functions
  on a device or other software.
