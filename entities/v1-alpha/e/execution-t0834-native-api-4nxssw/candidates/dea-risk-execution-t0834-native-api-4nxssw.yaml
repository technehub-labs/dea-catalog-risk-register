id: dea:risk-execution-t0834-native-api-4nxssw
type: Risk
name: T0834 — Native API
description: Adversaries may directly interact with the native OS application programming
  interface (API) to access system functions. Native APIs provide a controlled means
  of calling low-level OS services within the kernel, such as those involving hardware/devices,
  memory, and processes.
