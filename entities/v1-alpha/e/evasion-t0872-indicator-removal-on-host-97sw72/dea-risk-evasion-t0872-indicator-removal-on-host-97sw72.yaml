id: dea:risk-evasion-t0872-indicator-removal-on-host-97sw72
type: Risk
name: T0872 — Indicator Removal on Host
description: Adversaries may attempt to remove indicators of their presence on a system
  in an effort to cover their tracks. In cases where an adversary may feel detection
  is imminent, they may try to overwrite, delete, or cover up changes they have made
  to the device.
