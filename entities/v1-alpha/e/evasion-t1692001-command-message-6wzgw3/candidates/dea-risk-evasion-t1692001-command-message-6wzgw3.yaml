id: dea:risk-evasion-t1692001-command-message-6wzgw3
type: Risk
name: T1692.001 — Command Message
description: Adversaries may send unauthorized command messages to instruct control
  system assets to perform actions outside of their intended functionality, or without
  the logical preconditions to trigger their expected function. Command messages are
  used in ICS networks to give direct instructions to control systems devices.
