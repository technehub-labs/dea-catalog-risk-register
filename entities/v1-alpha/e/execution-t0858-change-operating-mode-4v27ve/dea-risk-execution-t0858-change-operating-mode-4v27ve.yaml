id: dea:risk-execution-t0858-change-operating-mode-4v27ve
type: Risk
name: T0858 — Change Operating Mode
description: Adversaries may change the operating mode of a controller to gain additional
  access to engineering functions such as Program Download. Programmable controllers
  typically have several modes of operation that control the state of the user program
  and control access to the controllers API.
