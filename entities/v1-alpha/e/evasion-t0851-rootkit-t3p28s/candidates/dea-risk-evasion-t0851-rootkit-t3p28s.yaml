id: dea:risk-evasion-t0851-rootkit-t3p28s
type: Risk
name: T0851 — Rootkit
description: Adversaries may deploy rootkits to hide the presence of programs, files,
  network connections, services, drivers, and other system components. Rootkits are
  programs that hide the existence of malware by intercepting and modifying operating-system
  API calls that supply system information.
