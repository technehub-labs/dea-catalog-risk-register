type: Risk
name: T1639.001 — Exfiltration Over Unencrypted Non-C2 Protocol
description: Adversaries may steal data by exfiltrating it over an un-encrypted network
  protocol other than that of the existing command and control channel. The data may
  also be sent to an alternate network location from the main command and control
  server.
