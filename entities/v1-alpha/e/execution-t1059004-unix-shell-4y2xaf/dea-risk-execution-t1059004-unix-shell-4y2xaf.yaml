type: Risk
name: T1059.004 — Unix Shell
description: Adversaries may abuse Unix shell commands and scripts for execution.
  Unix shells are the primary command prompt on Linux, macOS, and ESXi systems, though
  many variations of the Unix shell exist (e.g. sh, ash, bash, zsh, etc.) depending
  on the specific OS or distribution.
