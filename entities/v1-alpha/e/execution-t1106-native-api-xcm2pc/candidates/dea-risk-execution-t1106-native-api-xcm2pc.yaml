id: dea:risk-execution-t1106-native-api-xcm2pc
type: Risk
name: T1106 — Native API
description: Adversaries may interact with the native OS application programming interface
  (API) to execute behaviors. Native APIs provide a controlled means of calling low-level
  OS services within the kernel, such as those involving hardware/devices, memory,
  and processes.
