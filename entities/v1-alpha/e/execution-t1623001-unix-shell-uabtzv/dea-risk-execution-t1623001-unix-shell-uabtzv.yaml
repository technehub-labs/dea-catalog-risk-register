id: dea:risk-execution-t1623001-unix-shell-uabtzv
type: Risk
name: T1623.001 — Unix Shell
description: Adversaries may abuse Unix shell commands and scripts for execution.
  Unix shells are the underlying command prompts on Android and iOS devices. Unix
  shells can control every aspect of a system, with certain commands requiring elevated
  privileges that are only accessible if the device has been rooted or jailbroken.
