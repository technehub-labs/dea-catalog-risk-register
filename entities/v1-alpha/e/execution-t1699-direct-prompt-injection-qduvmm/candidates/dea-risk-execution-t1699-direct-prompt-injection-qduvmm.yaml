id: dea:risk-execution-t1699-direct-prompt-injection-qduvmm
type: Risk
name: T1699 — Direct Prompt Injection
description: Adversaries may input malicious prompts directly into an LLM’s user interface.
  The prompts can be designed to bypass safeguards, manipulate context, override previous
  instructions, or coerce the LLM into unauthorized behavior. Adversaries may use
  direct prompt injection to [Generate Content](https://attack.mitre.
