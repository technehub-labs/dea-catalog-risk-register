id: dea:risk-execution-t1569001-launchctl-47v6cu
type: Risk
name: T1569.001 — Launchctl
description: Adversaries may abuse launchctl to execute commands or programs. Launchctl
  interfaces with launchd, the service management framework for macOS. Launchctl supports
  taking subcommands on the command-line, interactively, or even redirected from standard
  input.
