id: dea:risk-execution-t1701006-javascript-m5y283
type: Risk
name: T1701.006 — JavaScript
description: Adversaries may abuse various implementations of JavaScript for execution.
  JavaScript is a platform-independent scripting language (compiled just-in-time at
  runtime) commonly associated with scripts in webpages, though JavaScript can be
  executed in runtime environments outside the browser.
