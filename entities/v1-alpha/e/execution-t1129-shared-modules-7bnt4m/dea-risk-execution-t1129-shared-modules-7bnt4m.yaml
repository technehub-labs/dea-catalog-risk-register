id: dea:risk-execution-t1129-shared-modules-7bnt4m
type: Risk
name: T1129 — Shared Modules
description: Adversaries may execute malicious payloads via loading shared modules.
  Shared modules are executable files that are loaded into processes to provide access
  to reusable code, such as specific custom functions or invoking OS API functions
  (i.e., [Native API](https://attack.mitre.org/techniques/T1106)).
