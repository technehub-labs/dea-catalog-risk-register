type: Risk
name: T1569.003 — Systemctl
description: Adversaries may abuse systemctl to execute commands or programs. Systemctl
  is the primary interface for systemd, the Linux init system and service manager.
  Typically invoked from a shell, Systemctl can also be integrated into scripts or
  applications.
