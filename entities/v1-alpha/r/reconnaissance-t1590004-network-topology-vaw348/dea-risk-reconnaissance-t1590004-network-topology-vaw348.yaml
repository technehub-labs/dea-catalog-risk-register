id: dea:risk-reconnaissance-t1590004-network-topology-vaw348
type: Risk
name: T1590.004 — Network Topology
description: Adversaries may gather information about the victim's network topology
  that can be used during targeting. Information about network topologies may include
  a variety of details, including the physical and/or logical arrangement of both
  external-facing and internal network environments.
