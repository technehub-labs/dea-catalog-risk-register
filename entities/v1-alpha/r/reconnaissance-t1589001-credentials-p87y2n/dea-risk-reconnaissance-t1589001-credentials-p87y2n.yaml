id: dea:risk-reconnaissance-t1589001-credentials-p87y2n
type: Risk
name: T1589.001 — Credentials
description: Adversaries may gather credentials that can be used during targeting.
  Account credentials gathered by adversaries may be those directly associated with
  the target victim organization or attempt to take advantage of the tendency for
  users to use the same passwords across personal and business accounts.
