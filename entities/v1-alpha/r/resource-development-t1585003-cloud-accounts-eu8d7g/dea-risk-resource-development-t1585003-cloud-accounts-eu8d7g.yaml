type: Risk
name: T1585.003 — Cloud Accounts
description: Adversaries may create accounts with cloud providers that can be used
  during targeting. Adversaries can use cloud accounts to further their operations,
  including leveraging cloud storage services such as Dropbox, MEGA, Microsoft OneDrive,
  or AWS S3 buckets for [Exfiltration to Cloud Storage](https://attack.mitre.
