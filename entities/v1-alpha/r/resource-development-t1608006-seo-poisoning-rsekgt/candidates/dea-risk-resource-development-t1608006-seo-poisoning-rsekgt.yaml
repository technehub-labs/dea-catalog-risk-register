type: Risk
name: T1608.006 — SEO Poisoning
description: Adversaries may poison mechanisms that influence search engine optimization
  (SEO) to further lure staged capabilities towards potential victims. Search engines
  typically display results to users based on purchased ads as well as the site’s
  ranking/score/reputation calculated by their web crawlers and algorithms.
