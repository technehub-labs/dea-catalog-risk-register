name: T1583 — Acquire Infrastructure
description: Adversaries may buy, lease, rent, or obtain infrastructure that can be
  used during targeting. A wide variety of infrastructure exists for hosting and orchestrating
  adversary operations. Infrastructure solutions include physical or cloud servers,
  domains, and third-party web services.
