id: dea:risk-resource-development-t1588004-digital-certificat-apxu9v
type: Risk
name: T1588.004 — Digital Certificates
description: Adversaries may buy and/or steal SSL/TLS certificates that can be used
  during targeting. SSL/TLS certificates are designed to instill trust. They include
  information about the key, information about its owner's identity, and the digital
  signature of an entity that has verified the certificate's contents are correct.
