id: dea:risk-reconnaissance-t1593002-search-engines-cmgzw4
type: Risk
name: T1593.002 — Search Engines
description: Adversaries may use search engines to collect information about victims
  that can be used during targeting. Search engine services typically crawl online
  sites to index content and may provide users with specialized syntax to search for
  specific keywords or specific types of content (i.e. filetypes).
