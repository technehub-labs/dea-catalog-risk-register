id: dea:risk-resource-development-t1583001-domains-pcrhke
type: Risk
name: T1583.001 — Domains
description: Adversaries may acquire domains that can be used during targeting. Domain
  names are the human readable names used to represent one or more IP addresses. They
  can be purchased or, in some cases, acquired for free. Adversaries may use acquired
  domains for a variety of purposes, including for [Phishing](https://attack.
