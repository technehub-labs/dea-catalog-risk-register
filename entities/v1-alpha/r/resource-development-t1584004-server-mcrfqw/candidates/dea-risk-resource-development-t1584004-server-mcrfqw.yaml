name: T1584.004 — Server
description: Adversaries may compromise third-party servers that can be used during
  targeting. Use of servers allows an adversary to stage, launch, and execute an operation.
  During post-compromise activity, adversaries may utilize servers for various tasks,
  including for Command and Control.
