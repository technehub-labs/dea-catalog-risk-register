id: dea:risk-reconnaissance-t1596001-dns-passive-dns-w9zqwv
type: Risk
name: T1596.001 — DNS/Passive DNS
description: Adversaries may search DNS data for information about victims that can
  be used during targeting. DNS information may include a variety of details, including
  registered name servers as well as records that outline addressing for a target’s
  subdomains, mail servers, and other hosts.
