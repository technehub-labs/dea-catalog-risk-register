id: dea:risk-reconnaissance-t1596002-whois-9dpust
type: Risk
name: T1596.002 — WHOIS
description: Adversaries may search public WHOIS data for information about victims
  that can be used during targeting. WHOIS data is stored by regional Internet registries
  (RIR) responsible for allocating and assigning Internet resources such as domain
  names.
