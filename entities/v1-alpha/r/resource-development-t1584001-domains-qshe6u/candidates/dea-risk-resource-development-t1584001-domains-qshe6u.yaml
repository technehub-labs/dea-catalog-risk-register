id: dea:risk-resource-development-t1584001-domains-qshe6u
type: Risk
name: T1584.001 — Domains
description: Adversaries may hijack domains and/or subdomains that can be used during
  targeting. Domain registration hijacking is the act of changing the registration
  of a domain name without the permission of the original registrant. Adversaries
  may gain access to an email account for the person listed as the owner of the domain.
