id: dea:risk-reconnaissance-t1590005-ip-addresses-t8xysm
type: Risk
name: T1590.005 — IP Addresses
description: Adversaries may gather the victim's IP addresses that can be used during
  targeting. Public IP addresses may be allocated to organizations by block, or a
  range of sequential addresses. Information about assigned IP addresses may include
  a variety of details, such as which IP addresses are in use.
