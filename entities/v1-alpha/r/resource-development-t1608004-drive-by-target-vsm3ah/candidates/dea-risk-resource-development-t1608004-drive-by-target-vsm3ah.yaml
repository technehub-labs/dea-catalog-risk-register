name: T1608.004 — Drive-by Target
description: Adversaries may prepare an operational environment to infect systems
  that visit a website over the normal course of browsing. Endpoint systems may be
  compromised through browsing to adversary controlled sites, as in [Drive-by Compromise](https://attack.mitre.org/techniques/T1189).
