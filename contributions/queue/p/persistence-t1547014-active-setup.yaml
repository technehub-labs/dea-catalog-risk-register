name: T1547.014 — Active Setup
description: Adversaries may achieve persistence by adding a Registry key to the Active
  Setup of the local machine. Active Setup is a Windows mechanism that is used to
  execute programs when a user logs in. The value stored in the Registry key will
  be executed after a user logs into the computer.
