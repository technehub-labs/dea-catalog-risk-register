name: T1547.002 — Authentication Package
description: Adversaries may abuse authentication packages to execute DLLs when the
  system boots. Windows authentication package DLLs are loaded by the Local Security
  Authority (LSA) process at system start. They provide support for multiple logon
  processes and multiple security protocols to the operating system.
