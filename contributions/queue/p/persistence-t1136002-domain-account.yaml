name: T1136.002 — Domain Account
description: Adversaries may create a domain account to maintain access to victim
  systems. Domain accounts are those managed by Active Directory Domain Services where
  access and permissions are configured across systems and services that are part
  of that domain. Domain accounts can cover user, administrator, and service accounts.
