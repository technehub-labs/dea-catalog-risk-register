name: T1137.002 — Office Test
description: Adversaries may abuse the Microsoft Office "Office Test" Registry key
  to obtain persistence on a compromised system. An Office Test Registry location
  exists that allows a user to specify an arbitrary DLL that will be executed every
  time an Office application is started.
