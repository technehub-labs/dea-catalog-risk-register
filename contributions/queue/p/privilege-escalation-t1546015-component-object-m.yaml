name: T1546.015 — Component Object Model Hijacking
description: Adversaries may establish persistence by executing malicious content
  triggered by hijacked references to Component Object Model (COM) objects. COM is
  a system within Windows to enable interaction between software components through
  the operating system. References to various COM objects are stored in the Registry.
