name: T1543 — Create or Modify System Process
description: Adversaries may create or modify system-level processes to repeatedly
  execute malicious payloads as part of persistence. When operating systems boot up,
  they can start processes that perform background system functions. On Windows and
  Linux, these system processes are referred to as services.
