name: T1587.003 — Digital Certificates
description: Adversaries may create self-signed SSL/TLS certificates that can be used during targeting.
  SSL/TLS certificates are designed to instill trust. They include information about the key, information
  about its owner's identity, and the digital signature of an entity that has verified the certificate's
  contents are correct.
