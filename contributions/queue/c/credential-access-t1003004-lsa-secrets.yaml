name: T1003.004 — LSA Secrets
description: Adversaries with SYSTEM access to a host may attempt to access Local
  Security Authority (LSA) secrets, which can contain a variety of different credential
  materials, such as credentials for service accounts. LSA secrets are stored in the
  registry at <code>HKEY_LOCAL_MACHINE\SECURITY\Policy\Secrets</code>.
