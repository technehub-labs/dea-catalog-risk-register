name: T1634.001 — Keychain
description: Adversaries may collect keychain data from an iOS device to acquire credentials.
  Keychains are the built-in way for iOS to keep track of users' passwords and credentials
  for many services and features such as Wi-Fi passwords, websites, secure notes,
  certificates, private keys, and VPN credentials.
