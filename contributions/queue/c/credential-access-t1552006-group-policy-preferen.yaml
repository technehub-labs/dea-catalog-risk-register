name: T1552.006 — Group Policy Preferences
description: Adversaries may attempt to find unsecured credentials in Group Policy
  Preferences (GPP). GPP are tools that allow administrators to create domain policies
  with embedded credentials. These policies allow administrators to set local accounts.
  These group policies are stored in SYSVOL on a domain controller.
