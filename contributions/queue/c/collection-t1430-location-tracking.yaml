name: T1430 — Location Tracking
description: Adversaries may track a device’s physical location through use of standard
  operating system APIs via malicious or exploited applications on the compromised
  device. On Android, applications holding the `ACCESS_COAURSE_LOCATION` or `ACCESS_FINE_LOCATION`
  permissions provide access to the device’s physical location.
