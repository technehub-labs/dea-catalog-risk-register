name: T1053.006 — Systemd Timers
description: Adversaries may abuse systemd timers to perform task scheduling for initial
  or recurring execution of malicious code. Systemd timers are unit files with file
  extension <code>.timer</code> that control services. Timers can be set to run on
  a calendar event or after a time span relative to a starting point.
