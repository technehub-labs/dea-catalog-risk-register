name: T1698 — Indirect Prompt Injection
description: Adversaries may deliver malicious prompts to an LLM indirectly by embedding the prompts in
  content that the adversary expects may be processed by an LLM. These prompts can be included in web
  pages, documents, emails, tickets, code, or other sources that an agent, copilot, or other AI system
  may retrieve and process.
