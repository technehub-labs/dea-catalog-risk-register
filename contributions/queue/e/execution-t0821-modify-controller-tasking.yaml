name: T0821 — Modify Controller Tasking
description: Adversaries may modify the tasking of a controller to allow for the execution of their own
  programs. This can allow an adversary to manipulate the execution flow and behavior of a controller.
  According to 61131-3, the association of a Task with a Program Organization Unit (POU) defines a task
  association.
