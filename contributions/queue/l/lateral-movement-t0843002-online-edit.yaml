name: T0843.002 — Online Edit
description: Adversaries may execute an online edit of a PLC to update parts of an
  existing program. It does not require stopping the PLC which allows it to continue
  running during transfer and reconfiguration without interruption to process control.
  Adversaries may leverage this approach to minimize downtime and evade detection.
