name: T1070.003 — Clear Command History
description: In addition to clearing system logs, an adversary may clear the command history of a compromised
  account to conceal the actions undertaken during an intrusion. Various command interpreters keep track
  of the commands users type in their terminal so that users can retrace what they've done.
