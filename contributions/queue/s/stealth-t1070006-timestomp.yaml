name: T1070.006 — Timestomp
description: Adversaries may modify file time attributes to hide new files or changes to existing files.
  Timestomping is a technique that modifies the timestamps of a file (the modify, access, create, and
  change times), often to mimic files that are in the same folder and blend malicious files with legitimate
  files.
