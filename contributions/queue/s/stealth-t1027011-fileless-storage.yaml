name: T1027.011 — Fileless Storage
description: Adversaries may store data in "fileless" formats to conceal malicious
  activity from defenses. Fileless storage can be broadly defined as any format other
  than a file. Common examples of non-volatile fileless storage in Windows systems
  include the Windows Registry, event logs, or WMI repository.
