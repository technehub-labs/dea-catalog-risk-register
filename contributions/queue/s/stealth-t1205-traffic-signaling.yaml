name: T1205 — Traffic Signaling
description: Adversaries may use traffic signaling to hide open ports or other malicious
  functionality used for persistence or command and control. Traffic signaling involves
  the use of a magic value or sequence that must be sent to a system to trigger a
  special response, such as opening a closed port or executing a malicious task.
