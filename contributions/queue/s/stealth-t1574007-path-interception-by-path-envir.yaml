name: T1574.007 — Path Interception by PATH Environment Variable
description: Adversaries may execute their own malicious payloads by hijacking environment variables used
  to load libraries. The PATH environment variable contains a list of directories (User and System) that
  the OS searches sequentially through in search of the binary that was called from a script or the command
  line.
