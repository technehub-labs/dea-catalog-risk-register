name: T1684.002 — Email Spoofing
description: Adversaries may fake, or spoof, a sender’s identity by modifying the
  value of relevant email headers in order to establish contact with victims under
  false pretenses. In addition to actual email content, email headers (such as the
  FROM header, which contains the email address of the sender) may also be modified.
