name: T1574.011 — Services Registry Permissions Weakness
description: Adversaries may execute their own malicious payloads by hijacking the
  Registry entries used by services. Flaws in the permissions for Registry keys related
  to services can allow adversaries to redirect the originally specified executable
  to one they control, launching their own code when a service starts.
