name: T1036.007 — Double File Extension
description: 'Adversaries may abuse a double extension in the filename as a means of masquerading the
  true file type. A file name may include a secondary file type extension that may cause only the first
  extension to be displayed (ex: <code>File.txt.exe</code> may render in some views as just <code>File.txt</code>).'
