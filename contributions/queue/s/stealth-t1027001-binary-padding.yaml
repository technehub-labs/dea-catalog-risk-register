name: T1027.001 — Binary Padding
description: Adversaries may use binary padding to add junk data and change the on-disk representation
  of malware. This can be done without affecting the functionality or behavior of a binary, but can increase
  the size of the binary beyond what some security tools are capable of handling due to file size limitations.
