name: T1036.011 — Overwrite Process Arguments
description: Adversaries may modify a process's in-memory arguments to change its
  name in order to appear as a legitimate or benign process. On Linux, the operating
  system stores command-line arguments in the process’s stack and passes them to the
  `main()` function as the `argv` array.
