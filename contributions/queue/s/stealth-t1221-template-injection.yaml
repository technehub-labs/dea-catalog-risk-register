name: T1221 — Template Injection
description: Adversaries may create or modify references in user document templates to conceal malicious
  code or force authentication attempts. For example, Microsoft’s Office Open XML (OOXML) specification
  defines an XML-based format for Office documents (.docx, xlsx, .pptx) to replace older binary formats
  (.doc, .xls, .ppt).
