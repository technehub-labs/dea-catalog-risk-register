name: T1582 — SMS Control
description: Adversaries may delete, alter, or send SMS messages without user authorization. This could
  be used to hide C2 SMS messages, spread malware, or various external effects. This can be accomplished
  by requesting the `RECEIVE_SMS` or `SEND_SMS` permissions depending on what the malware is attempting
  to do.
