name: T1688 — Safe Mode Boot
description: Adversaries may abuse Windows safe mode to disable endpoint defenses.
  Safe mode starts up the Windows operating system with a limited set of drivers and
  services. Third-party security software such as endpoint detection and response
  (EDR) tools may not start after booting Windows in safe mode.
