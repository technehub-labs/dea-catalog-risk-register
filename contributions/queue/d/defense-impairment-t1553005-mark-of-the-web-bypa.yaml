name: T1553.005 — Mark-of-the-Web Bypass
description: Adversaries may abuse specific file formats to subvert Mark-of-the-Web (MOTW) controls. In
  Windows, when files are downloaded from the Internet, they are tagged with a hidden NTFS Alternate Data
  Stream (ADS) named <code>Zone.Identifier</code> with a specific value known as the MOTW.
