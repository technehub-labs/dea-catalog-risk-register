name: T1406.002 — Software Packing
description: Adversaries may perform software packing to conceal their code. Software packing is a method
  of compressing or encrypting an executable. Packing an executable changes the file signature in an attempt
  to avoid signature-based detection. Most decompression techniques decompress the executable code in
  memory.
